name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Decide whether browser regression is needed
        id: browser-plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/browser-evidence.mjs plan
      - name: Install browser
        if: steps.browser-plan.outputs.run-browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser regression
        if: steps.browser-plan.outputs.run-browser == 'true'
        run: pnpm exec playwright test
      - name: Record browser test evidence
        if: steps.browser-plan.outputs.run-browser == 'true'
        run: node scripts/browser-evidence.mjs record
      - name: Upload browser test evidence
        if: steps.browser-plan.outputs.run-browser == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/browser-evidence/evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Seal the tested package on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci-artifact.mjs seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: checked-package-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/packages/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: moderate
