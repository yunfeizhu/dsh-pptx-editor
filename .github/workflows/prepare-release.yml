name: Prepare release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag, for example v0.1.0
        type: string
        required: true
      commit:
        description: Exact approved 40-character commit of the tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate the release target and find its successful main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/check-release-target.mjs
          node scripts/ci-artifact.mjs select
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run-id }}
          name: ${{ steps.source.outputs.artifact-name }}
          path: .cache/packages
      - name: Verify the CI artifact and add release notes
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run-id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run-attempt }}
        run: |
          node scripts/ci-artifact.mjs verify
          git show "$RELEASE_COMMIT:CHANGELOG.md" > .cache/packages/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: .cache/packages/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release-package
      - name: Create a reviewable release with the checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release-package
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md dsh-pptx-editor-*.tgz SHA256SUMS.txt COMMIT.txt CI_ARTIFACT.json
