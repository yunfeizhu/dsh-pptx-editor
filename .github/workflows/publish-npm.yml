name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag, for example v0.1.0
        type: string
        required: true
      commit:
        description: Exact approved 40-character commit of the tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/tags/{0}', inputs.tag)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      # GitHub requires write access to read draft release assets.
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate the immutable release target
        run: |
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          node scripts/check-release-target.mjs
      - name: Fetch and verify the prepared package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release-package
          gh release download "$RELEASE_TAG" --dir release-package \
            --pattern 'dsh-pptx-viewer-*.tgz' --pattern SHA256SUMS.txt --pattern COMMIT.txt
          cd release-package
          test "$(cat COMMIT.txt)" = "$RELEASE_COMMIT"
          sha256sum --check SHA256SUMS.txt
          test "$(find . -name '*.tgz' | wc -l)" -eq 1
          tar -xOf dsh-pptx-viewer-*.tgz package/package.json > package.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.name!=="dsh-pptx-viewer" || `v${p.version}`!==process.env.RELEASE_TAG || p.private) process.exit(1)'
      - name: Publish the verified tarball using npm trusted publishing
        run:
          npm publish ./release-package/dsh-pptx-viewer-*.tgz --access public
          --provenance --ignore-scripts
